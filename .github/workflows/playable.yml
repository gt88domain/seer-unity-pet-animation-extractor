name: Playable campaign
on:
  pull_request:
    branches:
      - refactor/html5-ai-data-world-v2
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: playable-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record tested revision
        run: git rev-parse HEAD
      - name: Export review workspace
        run: |
          mkdir -p /tmp/game-review
          git archive --format=tar.gz -o /tmp/game-review/review-source.tar.gz HEAD game tools AGENTS.md
          git rev-parse HEAD > /tmp/game-review/TESTED_SHA.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: game-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/game-review/
          retention-days: 7
          if-no-files-found: error
      - name: JavaScript syntax
        run: for f in game/js/*.js tools/*.mjs; do node --check "$f"; done
      - name: Data and compiler validation
        run: |
          node tools/validate_data.mjs
          node tools/validate_data_v2.mjs
          python -m unittest discover -s tools -p 'test_build_data_v2.py' -v
      - name: Existing game smoke
        run: node tools/smoke.mjs
